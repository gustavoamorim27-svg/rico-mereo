  font: 500 10px/1.65 var(--mono);
  letter-spacing: 1.7px;
  color: var(--muted);
  text-transform: uppercase;
}
.sidebar .eyebrow {
  color: var(--subtle);
  font-size: 9px;
  margin: 36px 12px 12px;
}
.nav-items {
  display: grid;
  gap: 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 13px;
  width: 100%;
  text-align: left;
  min-height: 46px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  position: relative;
  transition: background 0.18s, color 0.18s;
}
.nav-item:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}
.nav-item.active {
  color: var(--accent-text);
  background: color-mix(in srgb, var(--orange) 9%, transparent);
}
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 10px;
  bottom: 10px;
  width: 3px;
  background: var(--orange);
  border-radius: 0 3px 3px 0;
}
.nav-item svg {
  width: 18px;
  height: 18px;
}
.nav-item .nav-count {
  margin-left: auto;
  font: 500 11px var(--mono);
  color: var(--muted);
  background: rgba(255, 255, 255, 0.08);
  border-radius: 5px;
  padding: 2px 7px;
}
.sidebar-footer {
  margin-top: auto;
}
.private-note {
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 24px 3px;
  padding: 13px 12px;
  display: flex;
  gap: 9px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--subtle);
  background: rgba(255, 255, 255, 0.03);
}
.private-note svg {
  width: 15px;
  margin-top: 2px;
  color: var(--orange);
}
.account {
  border-top: 1px solid var(--border);
  padding: 18px 6px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text);
}
.account .avatar {
  background: var(--orange-soft);
  color: var(--accent-text);
  width: 33px;
  height: 33px;
  font-size: 11px;
}
.account small {
  display: block;
  color: var(--subtle);
  font-size: 10px;
  margin-top: 3px;
}
.main {
  grid-column: 2;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}
.topbar {
  flex-shrink: 0;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  border-bottom: 1px solid var(--border);
  background: rgba(18, 11, 48, 0.18);
  font-size: 13px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 11px;
  color: var(--subtle);
}
.breadcrumb b {
  color: var(--muted);
  font-weight: 500;
}
.breadcrumb svg {
  width: 14px;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}
.sync {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--green);
}
.sync.pending,
.sync.offline {
  color: var(--yellow);
}
.sync.denied,
.sync.full {
  color: var(--red);
}
.content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  padding: 24px 32px 20px;
  width: 100%;
  max-width: 1760px;
  margin: 0 auto;
}
.content > * {
  flex-shrink: 0;
}
/* Quadro de pipes: cabeçalho compacto para sobrar altura às colunas */
.content[data-screen="board"] .page-title {
  margin-bottom: 10px;
}
.content[data-screen="board"] .metrics {
  margin-bottom: 12px;
}
.content[data-screen="board"] .metric {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 16px;
  flex-wrap: wrap;
}
.content[data-screen="board"] .metric .eyebrow {
  width: 100%;
}
.content[data-screen="board"] .metric strong {
  margin: 0;
  font-size: 20px;
}
.content[data-screen="board"] .metric small {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.content[data-screen="board"] .metric-icon {
  top: 10px;
  right: 12px;
}
.content[data-screen="board"] .metric-icon svg {
  width: 16px;
  height: 16px;
}
/* Sidebar recolhida: o conteúdo ganha o espaço, com respiro menor nas bordas */
.collapsed .content {
  padding-left: 22px;
  padding-right: 22px;
  max-width: none;
}
.collapsed .topbar {
  padding-left: 22px;
  padding-right: 22px;
}
.collapsed .board {
  gap: 10px;
}
.collapsed .column {
  padding: 10px 8px 6px;
}
/* Telas que cabem na altura: o que sobra rola dentro dos painéis */
.content[data-screen="board"] .board,
.content[data-screen="agenda"] .week-grid,
.content[data-screen="agenda"] .month-grid,
.content[data-screen="clients"] .client-list,
.content[data-screen="history"] .panel:last-child {
  flex: 1 1 auto;
  min-height: 0;
}
.content[data-screen="clients"] .client-list,
.content[data-screen="history"] .panel:last-child {
  overflow: auto;
}
.page-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
  min-height: 44px;
}
.page-title h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.2px;
  color: var(--muted);
}
.page-title h1::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--orange);
  margin-right: 10px;
  vertical-align: 2px;
}
/* Faixa de indicadores do quadro: uma linha só, para sobrar altura aos pipes */
.stat-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  align-items: center;
  padding: 9px 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 12px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.stat {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}
.stat svg {
  width: 14px;
  height: 14px;
  align-self: center;
  color: var(--subtle);
}
.stat b {
  font-family: var(--heading);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}
.stat.hot b {
  color: var(--accent-text-soft);
}
.stat.hot svg {
  color: var(--orange);
}
.stat.due b {
  color: #ffd166;
}
.page-title p {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.page-title .eyebrow {
  margin-bottom: 8px;
}
.title-actions {
  display: flex;
  gap: 9px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(218, 212, 255, 0.14);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--heading);
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.avatar.big {
  width: 66px;
  height: 66px;
  font-size: 21px;
  background: var(--orange-soft);
  color: var(--accent-text);
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 21px 23px;
  border-bottom: 1px solid var(--border);
}
.panel-head .row {
  flex-wrap: wrap;
  justify-content: flex-end;
}
.panel-pad {
  padding: 24px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.metric {
  padding: 14px 18px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 14px;
  position: relative;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.chips {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: wrap;
}
.chip {
  min-height: 39px;
  padding: 0 13px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid transparent;
  color: var(--subtle);
}
.chip.on {
  background: var(--orange-soft);
  border-color: color-mix(in srgb, var(--orange) 40%, transparent);
  color: var(--accent-text-soft);
}
.toolbar-spacer {
  flex: 1;
}
.toolbar-secondary {
  margin-top: -4px;
}
.chip-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.chip-label {
  font: 500 9px var(--mono);
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--subtle);
  padding-right: 2px;
}
.chip-group .chips {
  background: rgba(8, 8, 31, 0.32);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 3px;
  gap: 2px;
}
.chip-group .chip {
  border-radius: 9px;
  min-height: 38px;
}
.chip-group .chip.on {
  background: var(--orange);
  border-color: var(--orange);
  color: var(--on-accent) !important;
  box-shadow: 0 4px 14px var(--accent-glow);
}
.chip-count {
  margin-left: 6px;
  font: 500 10px var(--mono);
  background: rgba(255, 255, 255, 0.14);
  border-radius: 5px;
  padding: 1px 6px;
}
.chip.on .chip-count {
  background: rgba(0, 0, 0, 0.2);
}
.select-small {
  width: auto;
  max-width: 220px;
  font-size: 13px;
  min-height: 42px;
  padding: 8px 32px 8px 12px;
}
.segment {
  display: inline-flex;
  background: rgba(8, 8, 31, 0.4);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 3px;
}
.segment button {
  min-height: 33px;
  font-size: 12px;
  padding: 0 12px;
  color: var(--subtle);
}
.segment button.on {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text);
  border-radius: 6px;
}

/* Quadro de pipes */
.chips-radio {
  gap: 8px;
}
.chip-btn {
  min-height: 40px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(8, 8, 31, 0.32);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}
.chip-btn.on {
  background: var(--orange-soft);
  border-color: color-mix(in srgb, var(--orange) 55%, transparent);
  color: var(--text);
}
.notice {
  background: rgba(113, 153, 255, 0.12);
  border: 1px solid rgba(113, 153, 255, 0.3);
  border-radius: 12px;
  padding: 15px 18px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
}
.notice svg {
  color: var(--blue);
}
.notice .btn {
  margin-left: auto;
  flex-shrink: 0;
}
.notice.demo {
  background: rgba(255, 208, 117, 0.1);
  border-color: rgba(255, 208, 117, 0.35);
}
.notice.demo svg {
  color: var(--yellow);
}
.notice strong {
  font-weight: 600;
  color: var(--text);
}

/* Temas */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 6px;
}
.theme-card {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px;
  display: grid;
  gap: 8px;
  text-align: left;
  color: var(--text);
  background: rgba(8, 8, 31, 0.32);
}
.theme-card.on {
  border-color: var(--orange);
  box-shadow: 0 0 0 1px var(--orange);
}
.theme-swatch {
  height: 54px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.theme-swatch i {
  position: absolute;
  border-radius: 50%;
  width: 60%;
  height: 120%;
  filter: blur(12px);
}
.theme-card b {
  font-size: 13px;
}
.theme-card small {
  color: var(--subtle);
  font-size: 11px;
}

/* Diálogos */
dialog {
  width: min(640px, calc(100vw - 30px));
  max-height: calc(100dvh - 40px);
  padding: 0;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  box-shadow: 0 24px 90px rgba(0, 0, 0, 0.6);
  background: var(--panel-solid);
  color: var(--text);
  overscroll-behavior: contain;
}
dialog::backdrop {
  background: rgba(8, 8, 31, 0.55);
  backdrop-filter: blur(6px);
}
.dialog-head {
  padding: 21px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: sticky;
  top: 0;
  z-index: 2;
}
.dialog-head h2 {
  font-size: 20px;
}
.dialog-body {
  padding: 23px 25px;
}
.dialog-foot {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 17px 24px;
  background: var(--panel-solid);
  border-top: 1px solid var(--border);
  position: sticky;
  bottom: 0;
}
.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 17px;
}
.field {
  display: grid;
  align-content: start;
  gap: 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.field.full {
  grid-column: 1/-1;
}
.field small {
  font-weight: 400;
  line-height: 1.6;
  color: var(--subtle);
}
.field-check {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.form-error {
  color: var(--red);
  line-height: 1.6;
  font-size: 12px;
  margin: 12px 0;
}
.form-error:empty {
  display: none;
}
.toast {
  position: fixed;
  bottom: calc(24px + var(--safe));
  left: 50%;
  transform: translate(-50%, 20px);
  background: rgba(20, 14, 52, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-strong);
  color: var(--text);
  z-index: 2000;
  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
  padding: 14px 20px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 15px;
  max-width: 90vw;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}
.toast button {
  padding: 0 4px;
  min-height: 30px;
  color: var(--accent-text);
  text-decoration: underline;
  font-weight: 600;
}
.key {
  font: 13px var(--mono);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  background: rgba(8, 8, 31, 0.5);
  padding: 18px;
  border: 1px dashed var(--border-strong);
  border-radius: 12px;
  line-height: 1.8;
  user-select: all;
  color: var(--accent-text-soft);
}
@media (max-width: 1180px) {
  .shell {
    --sidebar-w: 196px;
  }
  .shell.collapsed {
    --sidebar-w: 76px;
  }
  .sidebar {
    padding: 24px 12px 18px;
  }
  .brand-logo {
    width: 62px;
    height: 27px;
  }
  .brand-label {
    font-size: 8px;
    letter-spacing: 1.2px;
  }
  .content {
    padding: 25px 23px;
  }
  .topbar {
    padding: 0 23px;
  }
  .metrics {
    gap: 10px;
  }
  .metric {
    padding: 15px;
  }
  .metric strong {
    font-size: 23px;
  }
  .metric-icon {
    display: none;
  }
  .board {
    grid-template-columns: repeat(4, minmax(220px, 1fr));
    gap: 11px;
  }
  .donut-layout {
    gap: 20px;
    padding: 24px 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend {
    min-width: 170px;
  }
  .detail-grid {
    grid-template-columns: minmax(0, 1.35fr) minmax(250px, 1fr);
  }
  .mereo-components {
    gap: 12px;
  }
  .mereo {
    gap: 12px;
    padding: 20px;
  }
  .mereo-score {
    width: 95px;
  }
}
@media (max-width: 950px) {
  .shell {
    --sidebar-w: 78px;
  }
  .sidebar {
    padding: 23px 10px;
  }
  .sidebar-toggle {
    display: none;
  }
  .brand-label,
  .brand-divider,
  .sidebar .eyebrow,
  .nav-item span,
  .private-note,
  .account div,
  .nav-count {
    display: none !important;
  }
  .sidebar .brand {
    justify-content: center;
    margin-bottom: 40px;
    padding: 0;
  }
  .brand-logo {
    width: 52px;
    height: 23px;
  }
  .nav-item {
    padding: 0;
    justify-content: center;
    min-height: 51px;
  }
  .nav-item.active::before {
    left: -10px;
  }
  .nav-item svg {
    width: 21px;
    height: 21px;
  }
  .account {
    padding: 15px 0;
    justify-content: center;
  }
  .account .avatar {
    display: flex !important;
  }
  .content {
    padding: 24px 20px;
  }
  .topbar {
    padding: 0 20px;
    height: 63px;
  }
  .metric {
    padding: 14px;
  }
  .metric strong {
    font-size: 21px;
  }
  .metric small {
    font-size: 10px;
  }
  .page-title h1 {
    font-size: 27px;
  }
  .title-actions .btn {
    padding: 0 12px;
    font-size: 12px;
  }
  .board {
    grid-template-columns: repeat(4, 230px);
  }
  .detail-grid {
    grid-template-columns: 1fr;
  }
  .donut-layout {
    flex-wrap: nowrap;
    justify-content: start;
    padding: 28px 40px;
  }
  .potential-list {
    grid-template-columns: 1fr 1fr;
  }
  .settings-grid {
    grid-template-columns: 1fr;
  }
  .week-grid {
    grid-template-columns: repeat(5, 170px);
  }
  .month-day {
    min-height: 96px;
    padding: 6px;
  }
  .mereo-component {
    font-size: 10px;
  }
  .welcome-story,
  .welcome-form {
    padding: 40px;
  }
  .welcome-story h1 {
    font-size: 38px;
  }
  .topbar-actions {
    gap: 7px;
  }
}
@media (max-width: 650px) {
  .shell {
    display: block;
    --sidebar-w: 0px;
  }
  .main {
    height: calc(100% - 65px - var(--safe));
  }
  .sidebar {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: calc(65px + var(--safe));
    padding: 5px 8px calc(5px + var(--safe));
    border-radius: 16px 16px 0 0;
    border-right: 0;
    border-top: 1px solid var(--border);
  }
  .sidebar .brand,
  .sidebar-footer {
    display: none;
  }
  .nav-items {
    display: flex;
    gap: 3px;
    justify-content: space-between;
  }
  .nav-item {
    min-height: 53px;
    flex: 1;
    flex-direction: column;
    gap: 3px;
    max-width: 85px;
  }
  .nav-item span {
    display: inline !important;
    font-size: 8px;
  }
  .nav-item.active::before {
    display: none;
  }
  .nav-item.active {
    box-shadow: inset 0 2px var(--orange);
  }
  .nav-item svg {
    width: 19px;
    height: 19px;
  }
  .topbar {
    height: 57px;
    padding: 0 17px;
  }
  .breadcrumb {
    font-size: 10px;
    gap: 7px;
  }
  .content {
    padding: 24px 16px;
  }
  .page-title {
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 20px;
    gap: 13px;
  }
  .page-title h1 {
    font-size: 27px;
  }
  .page-title p {
    font-size: 11px;
  }
  .metrics {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 21px;
  }
  .metrics .metric {
    padding: 16px;
  }
  .metric strong {
    font-size: 24px;
  }
  .toolbar {
    gap: 9px;
  }
  .search {
    max-width: none;
    flex-basis: 100%;
  }
  .chips {
    gap: 2px;
  }
  .chip {
    padding: 0 11px;

@media (prefers-reduced-motion: reduce) {
  *,
  *:before,

    scroll-behavior: auto !important;

    animation: none !important;
  }
}
.chip-check {
  position: relative;
  display: inline-flex;
}
.chip-check input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  min-height: 0;
}
.chip-check span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 42px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(8, 8, 31, 0.32);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.chip-check input:checked + span {
  background: var(--orange-soft);
  border-color: color-mix(in srgb, var(--orange) 55%, transparent);
  color: var(--text);
}
.chip-check input:focus-visible + span {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}
.chip-check .dot {
  width: 9px;
  height: 9px;
}
.fields .chips {
  gap: 8px;
}

.settings-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.settings-grid .panel {
  padding: 24px;
}
.settings-grid p {
  font-size: 13px;
  line-height: 1.8;
  color: var(--muted);
  margin: 12px 0 18px;
}
.settings-grid .row svg {
  color: var(--orange);
}

/* ===== MEREO do time — componentes próprios, sobre a base visual do Pipeline/Hub ===== */
:root {
  --s-top: #5fd3ff;
  --s-ok: #48d6a0;
  --s-mid: #ffd075;
  --s-low: #ff7a7a;
}
.s-top { --sc: var(--s-top); }
.s-ok { --sc: var(--s-ok); }
.s-mid { --sc: var(--s-mid); }
.s-low { --sc: var(--s-low); }
.none { --sc: var(--subtle); }
.wrap { flex-wrap: wrap; }
.center { justify-content: center; }
.spacer { flex: 1; }
.btn { min-height: 44px; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 12px; gap: 6px; }
.btn.sm svg { width: 16px; height: 16px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 0 10px 0 4px; }
.btn.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
.btn.danger, .icon-btn.danger { color: var(--red); }
.avatar { background: color-mix(in srgb, var(--mc, var(--orange)) 22%, transparent); color: color-mix(in srgb, var(--mc, var(--orange)) 70%, #fff); border: 1px solid color-mix(in srgb, var(--mc, var(--orange)) 35%, transparent); }
.avatar.big { width: 52px; height: 52px; font-size: 17px; background: color-mix(in srgb, var(--mc, var(--orange)) 22%, transparent); color: color-mix(in srgb, var(--mc, var(--orange)) 70%, #fff); }
.pill.ok { color: #7be6bd; background: rgba(72, 214, 160, 0.14); }
.pill.est { color: #ffd98f; background: rgba(255, 208, 117, 0.14); }
.progress { display: block; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; position: relative; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: var(--orange); transition: width .25s; }
.footnote { color: var(--subtle); font-size: 11.5px; line-height: 1.8; margin: 14px 2px 6px; }

/* Barra de período */
.period { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: rgba(8, 8, 31, 0.4); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
.stepper b { min-width: 150px; text-align: center; font-family: var(--heading); font-size: 13px; font-weight: 600; }
.stepper .icon-btn { width: 38px; min-height: 36px; padding: 6px; }
.stepper svg { width: 16px; height: 16px; }
.segment button { min-height: 36px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: 1.1fr 1fr 1.3fr 1fr; gap: 12px; margin-bottom: 14px; }
.kpi { padding: 14px 18px; border: 1px solid var(--border); background: var(--panel); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .eyebrow { color: var(--subtle); font-size: 9px; letter-spacing: 1.2px; }
.kpi strong { font-family: var(--heading); font-size: 26px; font-weight: 700; letter-spacing: -1px; line-height: 1.2; }
.kpi strong em { font-style: normal; color: var(--subtle); font-size: 17px; font-weight: 500; }
.kpi small { color: var(--muted); font-size: 12px; }
.kpi .progress { margin-top: 6px; }
.kpi.lead { background: linear-gradient(135deg, color-mix(in srgb, var(--orange) 22%, transparent), rgba(43, 75, 255, 0.14)); border-color: color-mix(in srgb, var(--orange) 35%, transparent); }
.kpi.lead strong { color: var(--accent-text-soft); font-size: 32px; }

/* Ranking do mês */
.ranking { padding: 6px; overflow: hidden; }
.rank-head, .rank-row { display: grid; grid-template-columns: 34px minmax(170px, 1.6fr) 118px repeat(5, minmax(54px, .55fr)) minmax(150px, 1fr); align-items: center; gap: 10px; }
.rank-head { padding: 10px 14px 8px; font: 500 9.5px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--subtle); }
.rank-head small { opacity: .7; }
.rank-row { width: 100%; text-align: left; padding: 10px 14px; border-radius: 12px; min-height: 64px; transition: background .15s; }
.rank-row + .rank-row, .heat-row + .heat-row { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 0; }
.rank-row:hover, .heat-row:hover { background: rgba(255, 255, 255, 0.05); }
.pos { font: 600 13px var(--mono); color: var(--subtle); text-align: center; }
.who { display: flex; align-items: center; gap: 11px; min-width: 0; text-align: left; }
.who > span:last-child { min-width: 0; display: grid; gap: 3px; }
.who b { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--subtle); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small .pill { padding: 2px 7px; font-size: 10px; }
.sc { display: grid; gap: 6px; }
.sc b { font-family: var(--heading); font-size: 22px; font-weight: 700; letter-spacing: -.8px; color: var(--sc); line-height: 1; }
.scale { position: relative; display: block; height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--s-low) 0%, var(--s-mid) 38%, var(--s-ok) 55%, var(--s-top) 100%); opacity: .9; }
.scale i { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--sc), 0 2px 8px rgba(0, 0, 0, .5); transform: translate(-50%, -50%); transition: left .25s; }
.comp { display: grid; gap: 1px; text-align: center; padding: 6px 4px; border-radius: 9px; background: color-mix(in srgb, var(--sc) 11%, transparent); }
.comp b { font-family: var(--heading); font-size: 15px; color: var(--sc); }
.comp small { font: 500 10px var(--mono); color: var(--subtle); }
.comp.none { background: rgba(255, 255, 255, .03); }
.capcol { display: grid; gap: 6px; }
.capcol small { font-size: 12px; color: var(--text); font-weight: 600; }
.capcol em { font-style: normal; color: var(--subtle); font-weight: 500; }

/* Mapa de calor do semestre */
.heat-head, .heat-row { display: grid; grid-template-columns: 34px minmax(180px, 1.7fr) repeat(6, minmax(56px, 1fr)) minmax(84px, 1.1fr); align-items: center; gap: 8px; }
.heat-head { padding: 10px 14px 8px; font: 500 10px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--subtle); text-align: center; }
.heat-head span:nth-child(2) { text-align: left; }
.heat-head .now { color: var(--accent-text); }
.heat-row { width: 100%; padding: 9px 14px; min-height: 62px; transition: background .15s; }
.cell { height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font: 700 13px var(--heading); color: var(--sc); background: color-mix(in srgb, var(--sc) 15%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 30%, transparent); }
.cell.est { border-style: dashed; }
.cell.none { background: rgba(255, 255, 255, .03); border-color: transparent; color: var(--subtle); font-weight: 500; }
.cell em { font: 500 10px var(--mono); font-style: normal; color: var(--subtle); }
.cell.total { height: 46px; background: color-mix(in srgb, var(--sc) 24%, transparent); }
.cell.total b { font-size: 18px; letter-spacing: -.5px; }
.legend { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); display: inline-block; margin-left: 6px; }
.legend i:first-child { margin-left: 0; }
.dash { border: 1px dashed var(--muted); border-radius: 4px; padding: 0 5px; }

/* Membro */
.member-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.who.big h2 { font-size: 19px; letter-spacing: -.4px; }
.who.big small { font-size: 12px; }
.member-nav { display: inline-flex; align-items: center; gap: 2px; }
.member-nav .icon-btn { width: 38px; }
.member-grid { display: grid; grid-template-columns: minmax(290px, .82fr) minmax(0, 1.5fr); gap: 16px; align-items: start; }
.score-panel { padding: 22px; position: sticky; top: 0; }
.score-hero { display: grid; gap: 6px; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.score-hero strong { font-family: var(--heading); font-size: 58px; font-weight: 700; letter-spacing: -2.5px; line-height: 1; color: var(--sc); margin-top: 4px; }
.score-hero .scale { margin-top: 10px; height: 8px; }
.scale-labels { display: flex; justify-content: space-between; font: 500 9.5px var(--mono); color: var(--subtle); }
.comp-list { display: grid; }
.comp-row { padding: 12px 0; display: grid; gap: 6px; }
.comp-row + .comp-row { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.comp-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.comp-top b { font-size: 13px; }
.comp-top small { color: var(--subtle); font: 500 10px var(--mono); }
.comp-score { font: 700 16px var(--heading); color: var(--sc); }
.comp-val { font-size: 12px; color: var(--text); display: flex; gap: 6px; align-items: baseline; }
.comp-val em { font-style: normal; color: var(--subtle); }
.comp-val span { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }
.comp-row .progress > span { background: var(--sc); }
.comp-row .progress i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .7); }
.gap { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .04); font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.gap b { color: var(--accent-text-soft); }

.entry-panel, .sem-panel { padding: 0; overflow: hidden; }
.entry-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.entry-head .eyebrow { display: block; margin-bottom: 8px; }
.status-seg button.on:first-child { background: rgba(255, 208, 117, .18); color: #ffd98f; }
.status-seg button.on:last-child { background: rgba(72, 214, 160, .18); color: #7be6bd; }
.entry-body { padding: 6px 20px 20px; }
.entry-group { padding: 16px 0 14px; display: grid; gap: 14px; }
.entry-group + .entry-group { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.entry-group h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.entry-group h3 svg { width: 17px; height: 17px; color: var(--orange); }
.entry-group h3 small { margin-left: auto; font: 500 10.5px var(--mono); color: var(--subtle); letter-spacing: .3px; }
.entry-group.two { grid-template-columns: 1fr 1fr; gap: 22px; }
.entry-group.two > div { display: grid; gap: 14px; align-content: start; }
.calc { font-size: 12px; color: var(--muted); }
.calc b { color: var(--text); }
details.sub { border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; background: rgba(8, 8, 31, .22); }
details.sub > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); list-style: none; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::before { content: '+'; font: 600 15px var(--mono); color: var(--orange); width: 14px; }
details.sub[open] > summary::before { content: '−'; }
details.sub > summary em { font-style: normal; font: 500 10px var(--mono); color: var(--accent-text); margin-left: auto; }
details.sub[open] { padding-bottom: 14px; }
details.sub .sl + .sl { margin-top: 14px; }

/* Sliders */
.sl { display: grid; gap: 9px; }
.sl-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.sl-out { min-height: 34px; padding: 0 10px; border-radius: 8px; font: 700 16px var(--heading); color: var(--text); background: rgba(255, 255, 255, .06); border: 1px solid transparent; letter-spacing: -.3px; }
.sl-out:hover { border-color: var(--border-strong); }
.sl.is-null .sl-out { color: var(--subtle); font-size: 13px; font-weight: 600; }
.sl.is-null input[type=range] { opacity: .45; }
.sl-type { width: 150px; min-height: 36px; padding: 5px 10px; font: 700 15px var(--heading); text-align: right; }
.sl input[type=range] { height: 8px; }
.sl-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.sl-presets .chip-btn { min-height: 34px; padding: 0 11px; font-size: 12px; }
.sl-hint { color: var(--subtle); font-size: 11.5px; }

/* Semestre do membro */
.bars { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 18px 20px 10px; height: 250px; }
.bar { display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center; gap: 6px; padding: 6px 0; border-radius: 12px; min-height: 0; }
.bar:hover { background: rgba(255, 255, 255, .05); }
.bar-val { font: 700 14px var(--heading); color: var(--sc); }
.bar-track { position: relative; width: 58%; max-width: 54px; height: 100%; border-radius: 10px; background: rgba(255, 255, 255, .05); display: flex; align-items: flex-end; overflow: hidden; }
.bar-track span { width: 100%; border-radius: 10px; background: linear-gradient(to top, color-mix(in srgb, var(--sc) 55%, transparent), var(--sc)); transition: height .3s; }
.bar.est .bar-track span { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--sc) 70%, transparent) 0 6px, color-mix(in srgb, var(--sc) 40%, transparent) 6px 12px); }
.bar-lbl { font: 600 12px var(--body); text-transform: capitalize; }
.bar small { font: 500 9.5px var(--mono); color: var(--subtle); text-transform: uppercase; letter-spacing: .8px; }
.sem-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sem-table th { text-align: left; font: 500 9.5px var(--mono); letter-spacing: 1.1px; text-transform: uppercase; color: var(--subtle); padding: 10px 20px 8px; border-top: 1px solid var(--border); }
.sem-table td { padding: 9px 20px; border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent); text-transform: none; }
.sem-table td:first-child { text-transform: capitalize; font-weight: 600; }
.sem-table em { font-style: normal; color: var(--subtle); display: block; font-size: 11px; }
.sem-table td:last-child em { display: inline; }
.sem-table tr.dim td { color: var(--subtle); }
.sem-table tfoot td { font-weight: 700; background: rgba(255, 255, 255, .04); border-top: 1px solid var(--border); }
.sc-chip { display: inline-block; min-width: 50px; text-align: center; padding: 3px 8px; border-radius: 7px; font: 700 12.5px var(--heading); color: var(--sc); background: color-mix(in srgb, var(--sc) 15%, transparent); }

/* Equipe */
.member-list { padding: 6px; }
.member-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; min-height: 66px; }
.member-row + .member-row { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.member-row .who { flex: 1; min-height: 44px; border-radius: 10px; }
.member-row .who small { white-space: normal; }
.removed { margin-top: 14px; padding: 6px; }
.removed > summary { cursor: pointer; padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.hero-empty { padding: 48px 24px; text-align: center; display: grid; justify-items: center; gap: 12px; }
.hero-empty > svg { width: 38px; height: 38px; color: var(--orange); }
.hero-empty p { max-width: 460px; color: var(--muted); line-height: 1.7; margin-bottom: 8px; }

/* Minha base */
.settings-grid .wide { grid-column: 1 / -1; }
.settings-grid .row.wrap { gap: 8px; }
.fields.one { grid-template-columns: 1fr 1fr; margin-bottom: 16px; }
.key-form { display: flex; gap: 10px; align-items: flex-end; margin-top: 16px; }
.key-form .field { flex: 1; }
.rules { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
.rules th { text-align: left; font: 500 9.5px var(--mono); letter-spacing: 1.1px; text-transform: uppercase; color: var(--subtle); padding: 8px 10px; }
.rules td { padding: 9px 10px; border-top: 1px solid var(--border); }
.rules td:last-child { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rule-notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.9; }
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Diálogos */
dialog.wide { width: min(760px, calc(100vw - 30px)); }
.goal-box { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); display: grid; gap: 18px; }
.semgoal { border: 0; padding: 0; margin: 0; display: grid; gap: 16px; }
.semgoal .sl.total { padding: 14px; border-radius: 12px; background: color-mix(in srgb, var(--orange) 10%, transparent); border: 1px solid color-mix(in srgb, var(--orange) 28%, transparent); }
.month-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.sl.mini .sl-head span { text-transform: capitalize; }
.sl.mini .sl-head b { font: 700 14px var(--heading); color: var(--text); }
.sl.total .sl-head b { font: 700 18px var(--heading); color: var(--accent-text-soft); }

/* Responsivo */
@media (max-width: 1180px) {
  .rank-head, .rank-row { grid-template-columns: 30px minmax(150px, 1.5fr) 104px repeat(5, minmax(48px, .5fr)) minmax(120px, .9fr); gap: 8px; }
  .member-grid { grid-template-columns: minmax(260px, .8fr) minmax(0, 1.4fr); }
  .score-hero strong { font-size: 50px; }
}
@media (max-width: 1050px) {
  .hide-sm { display: none !important; }
  .rank-head, .rank-row { grid-template-columns: 30px minmax(150px, 1.5fr) 120px minmax(150px, 1fr); }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .member-grid { grid-template-columns: 1fr; }
  .score-panel { position: static; }
  .page-title { flex-wrap: wrap; }
}
@media (max-width: 800px) {
  .heat-head, .heat-row { grid-template-columns: 24px minmax(110px, 1.3fr) repeat(6, minmax(34px, 1fr)) minmax(52px, 1fr); gap: 5px; padding-left: 8px; padding-right: 8px; }
  .heat-row .who small { display: none; }
  .heat-row .avatar { display: none; }
  .cell { height: 34px; font-size: 11px; border-radius: 8px; }
  .cell.total b { font-size: 14px; }
  .settings-grid { grid-template-columns: 1fr; }
  .entry-group.two { grid-template-columns: 1fr; }
  .month-sliders { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  .hide-xs { display: none !important; }
  .rank-head, .rank-row { grid-template-columns: 26px minmax(0, 1fr) 96px; }
  .kpis { gap: 8px; }
  .kpi { padding: 12px 14px; }
  .kpi strong { font-size: 21px; }
  .kpi.lead strong { font-size: 26px; }
  .period { justify-content: flex-start; width: 100%; }
  .stepper b { min-width: 0; flex: 1; font-size: 12px; }
  .stepper { flex: 1; }
  .member-head .spacer { display: none; }
  .bars { height: 200px; gap: 4px; padding: 14px 10px 8px; }
  .sem-table th, .sem-table td { padding-left: 12px; padding-right: 12px; }
  .fields.one { grid-template-columns: 1fr; }
  .key-form { flex-direction: column; align-items: stretch; }
  .theme-grid { grid-template-columns: 1fr; }
  .heat-head { font-size: 8.5px; letter-spacing: .4px; }
  .member-row { flex-wrap: wrap; }
  .nav-item .nav-count { display: none !important; }
  .heat-head, .heat-row { grid-template-columns: minmax(64px, 1.3fr) repeat(6, minmax(0, 1fr)) minmax(40px, 1.1fr); gap: 3px; padding-left: 6px; padding-right: 6px; }
  .heat-head .hpos, .heat-row .pos { display: none; }
  .heat-row .who b { font-size: 12px; }
  .cell { font-size: 10px; height: 32px; border-radius: 7px; }
  .cell em { font-size: 8px; }
  .cell.total b { font-size: 13px; }
}

.bar-track::after { content: ''; position: absolute; left: -6px; right: -6px; bottom: 50%; border-top: 1px dashed rgba(255, 255, 255, .4); pointer-events: none; }
.settings-grid .btn.primary svg { color: inherit; }

.rules.card-metas td:last-child { font-family: inherit; }
.rules.card-metas { margin-top: 14px; }

// Motor MEREO — mesmas regras do Rico Pipeline (core.mjs → monthData), agora por membro do time.
// Card 2S2026: Captação Líquida 40% · Cesta Investimentos 20% · Cesta Cross Sell 10% · NPS Assessoria 20% · Índice Comercial 10%.
const MereoCore = (() => {
  // Ordem, nomes, pesos, curvas e racional do card de metas 2S2026 (Assessor | Exclusive Advisory DF II – Acc Load 500).
  const COMPONENTS = [
    { id: 'cap', name: 'Captação Líquida', short: 'Capt.', weight: .4, curve: [20, 60, 100, 140, 180], unit: 'R$', racional: 'Captação Líquida Total' },
    { id: 'cesta', name: 'Cesta Investimentos', short: 'Cesta', weight: .2, curve: [60, 80, 100, 120, 140], unit: 'R$', racional: 'Alocação nos ativos definidos no PC' },
    { id: 'cross', name: 'Cesta Cross Sell', short: 'Cross', weight: .1, curve: [60, 80, 100, 120, 140], unit: 'pts', racional: 'Meta 25 pts · mínimo seguros 10 · mínimo cartão N/A' },
    { id: 'nps', name: 'NPS Assessoria', short: 'NPS', weight: .2, curve: [60, 80, 100, 120, 140], unit: '', racional: 'NPS Assessoria Rico' },
    { id: 'ic', name: 'Índice Comercial', short: 'IC', weight: .1, curve: [80, 90, 100, 110, 120], unit: '%', racional: 'Aderência ao Índice Comercial Assessor' }
  ];
  // Metas padrão do pipeline: captação R$ 800 mil/mês, cesta R$ 2,2 mi, crossell 25 pts, IC 83%, NPS 41,3.
  const DEFAULT_GOALS = { cap: 800000, cesta: 2200000, cross: 25, ic: 83, nps: 41.3 };
  // Card de metas 2S2026 (Assessor · Exclusive Advisory DF II): NPS com meta mensal crescente e
  // crossell de 25 pts com mínimo de 10 pts em seguros (cartão sem mínimo).
  const NPS_META = { '2026-07': 35, '2026-08': 37.5, '2026-09': 40, '2026-10': 42.5, '2026-11': 45, '2026-12': 47.5 };
  const CROSS_MIN_SEG = 10;
  // sem o mínimo de seguros, os demais produtos contam no máximo (meta − mínimo) pontos
  function crossPoints(e, goal) {
    const seg = num(e.seg) / 1000, outros = num(e.cards) + num(e.con) / 10000;
    return seg >= CROSS_MIN_SEG ? seg + outros : seg + Math.min(outros, Math.max(0, (goal ?? DEFAULT_GOALS.cross) - CROSS_MIN_SEG));
  }
  const FLOW = ['cap', 'cesta', 'cross'];
  const INPUTS = ['cap', 'prev', 'stvm', 'aloc', 'cards', 'seg', 'con', 'ic', 'nps'];

  const num = v => (v == null || v === '' || !isFinite(+v)) ? 0 : +v;
  const pct = (v, m) => m > 0 ? v / m * 100 : 0;
  // Curva de 5 pontos: até curve[0] = 1; a partir de curve[4] = 5; linear entre os pontos. 100% da meta = 3.
  function score(p, curve) {
    if (p <= curve[0]) return 1;
    if (p >= curve[4]) return 5;
    for (let i = 0; i < 4; i++) if (p <= curve[i + 1]) return i + 1 + (p - curve[i]) / (curve[i + 1] - curve[i]);
    return 1;
  }
  const hasData = e => !!e && !e.cleared && INPUTS.some(k => e[k] != null && e[k] !== '');

  // Valores MEREO de um lançamento mensal.
  // Previdência/STVM dentro da captação pesam 1,25× (igual ao pipeline). A cesta soma alocação + previdência ponderada.
  // Crossell: cartão = 1 ponto, consórcio = 1 ponto a cada R$ 10 mil, seguro = 1 ponto a cada R$ 1 mil.
  function values(e, crossGoal) {
    e = e || {};
    const cap = num(e.cap), boosted = Math.min(num(e.prev) + num(e.stvm), cap);
    const prevW = Math.min(num(e.prev), cap) * 1.25;
    return {
      cap: cap + boosted * .25,
      cesta: num(e.aloc) + prevW,
      cross: crossPoints(e, crossGoal),
      ic: e.ic == null || e.ic === '' ? null : +e.ic,
      nps: e.nps == null || e.nps === '' ? null : +e.nps
    };
  }

  function build(vals, goals) {
    const components = COMPONENTS.map(c => {
      const assumed = vals[c.id] == null;
      const value = assumed ? goals[c.id] : vals[c.id];
      const p = pct(value, goals[c.id]);
      return { ...c, value, goal: goals[c.id], pct: p, score: score(p, c.curve), assumed };
    });
    return { components, score: components.reduce((s, c) => s + c.score * c.weight, 0) };
  }

  const monthKey = (id, month) => `${id}|${month}`;
  function goalsFor(member, month) {
    const base = { ...DEFAULT_GOALS, ...(member?.goals || {}) };
    const o = member?.monthGoals?.[month] || {};
    for (const k of FLOW) if (o[k] != null && o[k] !== '') base[k] = +o[k];
    if (o.nps != null && o.nps !== '') base.nps = +o.nps;
    else if (NPS_META[month] != null) base.nps = NPS_META[month];
    return base;
  }
  function monthResult(state, member, month) {
    const entry = state.entries?.[monthKey(member.id, month)];
    const filled = hasData(entry);
    const goals = goalsFor(member, month);
    const r = build(values(filled ? entry : {}, goals.cross), goals);
    return { ...r, month, goals, entry: filled ? entry : null, filled, status: filled ? (entry.status || 'est') : 'none' };
  }

  // Semestre: meses 1–6 (1º sem.) ou 7–12 (2º sem.).
  function semesterOf(month) { const y = +month.slice(0, 4), m = +month.slice(5, 7); return { year: y, half: m <= 6 ? 1 : 2 }; }
  function semesterMonths(sem) { const s = sem.half === 1 ? 1 : 7; return Array.from({ length: 6 }, (_, i) => `${sem.year}-${String(s + i).padStart(2, '0')}`); }
  function shiftSemester(sem, d) { let i = sem.year * 2 + sem.half - 1 + d; return { year: Math.floor(i / 2), half: i % 2 + 1 }; }

  // Visão semestral. Fluxos (captação, cesta, crossell) somam no semestre contra a soma das metas mensais;
  // IC e NPS usam a média dos meses lançados (sem lançamento = referência da meta, como no pipeline).
  // mode 'proj': meses sem lançamento recebem a média dos meses lançados (projeção de fechamento).
  // mode 'ytd' : compara só os meses lançados com as metas desses mesmos meses (ritmo até agora).
  function semesterResult(state, member, sem, mode = 'proj') {
    const months = semesterMonths(sem).map(m => monthResult(state, member, m));
    const filled = months.filter(m => m.filled);
    const vals = months.map(m => m.filled ? values(m.entry, m.goals.cross) : null);
    const filledVals = vals.filter(Boolean);
    const avg = k => filledVals.length ? filledVals.reduce((s, v) => s + v[k], 0) / filledVals.length : 0;
    const totals = {}, goals = {};
    for (const k of FLOW) {
      totals[k] = 0; goals[k] = 0;
      months.forEach((m, i) => {
        if (mode === 'ytd' && !m.filled) return;
        totals[k] += vals[i] ? vals[i][k] : (mode === 'proj' ? avg(k) : 0);
        goals[k] += m.goals[k];
      });
    }
    for (const k of ['ic', 'nps']) {
      const list = filledVals.map(v => v[k]).filter(v => v != null);
      totals[k] = list.length ? list.reduce((a, b) => a + b, 0) / list.length : null;
      goals[k] = months.reduce((s, m) => s + m.goals[k], 0) / months.length;
    }
    const r = build(totals, goals);
    return { ...r, months, totals, goals, filledCount: filled.length, realCount: filled.filter(m => m.status === 'real').length, mode, sem };
  }

  // Estado e mesclagem (cada registro com updatedAt; exclusão é marcação, para sincronizar entre aparelhos).
  function emptyState() { return { version: 1, members: {}, entries: {}, settings: { team: 'Meu time', leader: '', updatedAt: 0 } }; }
  function mergeMaps(a = {}, b = {}) {
    const out = { ...a };
    for (const [k, v] of Object.entries(b)) if (!out[k] || (v?.updatedAt || 0) > (out[k]?.updatedAt || 0)) out[k] = v;
    return out;
  }
  function merge(a, b) {
    a = a || emptyState(); b = b || emptyState();
    return {
      version: 1,
      members: mergeMaps(a.members, b.members),
      entries: mergeMaps(a.entries, b.entries),
      settings: (b.settings?.updatedAt || 0) > (a.settings?.updatedAt || 0) ? b.settings : a.settings
    };
  }
  function validate(s) {
    if (!s || typeof s !== 'object' || typeof s.members !== 'object' || typeof s.entries !== 'object') throw Error('Arquivo não reconhecido como base MEREO.');
    return { ...emptyState(), ...s, settings: { ...emptyState().settings, ...(s.settings || {}) } };
  }
  const activeMembers = s => Object.values(s.members || {}).filter(m => !m.removedAt).sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0) || String(a.name).localeCompare(b.name, 'pt-BR'));

  // Resumo do time (média simples das notas, somatório de captação).
  function teamSummary(state, list) {
    if (!list.length) return { avg: 0, above: 0, cap: 0, capGoal: 0, filled: 0, real: 0 };
    return {
      avg: list.reduce((s, r) => s + r.score, 0) / list.length,
      above: list.filter(r => r.score >= 3).length,
      cap: list.reduce((s, r) => s + r.components[0].value, 0),
      capGoal: list.reduce((s, r) => s + r.components[0].goal, 0),
      filled: list.filter(r => r.filled ?? r.filledCount > 0).length,

  return pageTitle('Painel', periodBar()) + strip + (view === 'month' ? teamMonth(rows) : teamSemester(rows));
}
function teamMonth(rows) {

  }).join('')}</section><p class="footnote">Toque em um membro para estimar ou lançar o realizado de ${monthName(month)}. “ref.” = IC/NPS sem lançamento, contando a referência da meta (nota 3), como no Pipeline.</p>`;

function teamSemester(rows) {

// ---------- Membro ----------

function scorePanel(m) {

const compRow = c => `<div class="comp-row ${scoreClass(c.score)}"><div class="comp-top"><span><b>${c.name}</b> <small>${c.weight * 100}%</small></span><span class="comp-score ${scoreClass(c.score)}">${c.score.toFixed(2).replace('.', ',')}</span></div><div class="comp-val">${fmtVal(c, c.value)} <em>de ${fmtVal(c, c.goal)}</em><span>${c.assumed ? 'referência' : pctTxt(c.pct)}</span></div><span class="progress"><span style="width:${Math.min(100, c.pct / c.curve[4] * 100)}%"></span><i style="left:${100 / c.curve[4] * 100}%"></i></span></div>`;

// Controles deslizantes: tocar, não digitar. O valor pode ser digitado tocando no número.
function slider({ key, label, value, min, max, step, fmt, presets = [], hint = '', nullable = false, isNull = false, scope = 'entry' }) {
  const shown = isNull ? value : value;
  return `<div class="sl ${isNull ? 'is-null' : ''}" data-sl="${key}"><div class="sl-head"><span>${label}</span><button type="button" class="sl-out" data-type="${key}" data-scope="${scope}" title="Digitar valor">${isNull ? 'Referência' : fmt(shown)}</button></div><input type="range" data-${scope}="${key}" min="${min}" max="${max}" step="${step}" value="${shown}" aria-label="${label}">${presets.length || nullable ? `<div class="sl-presets">${nullable ? `<button type="button" class="chip-btn ${isNull ? 'on' : ''}" data-null="${key}" data-scope="${scope}">Referência</button>` : ''}${presets.map(([t, v]) => `<button type="button" class="chip-btn ${!isNull && Math.abs(+v - shown) < step / 2 ? 'on' : ''}" data-preset="${key}" data-scope="${scope}" data-v="${v}">${t}</button>`).join('')}</div>` : ''}${hint ? `<small class="sl-hint" data-hint="${key}">${hint}</small>` : ''}</div>`;
}
const FMT = { money: v => C.shortMoney(v), int: v => C.fmtNum(v, 0), pct: v => C.fmtNum(v) + '%', nps: v => C.fmtNum(v) };
const roundStep = (v, s) => Math.round(v / s) * s;
function moneyStep(goal) { return goal >= 2e6 ? 25000 : goal >= 5e5 ? 10000 : goal >= 1e5 ? 5000 : 1000; }
function goalPresets(goal, step) { return [0, 50, 80, 100, 120, 150].map(p => [p === 0 ? 'Zero' : p + '%', roundStep(goal * p / 100, step)]); }

function entryFields(m, e) {
  const g = C.goalsFor(m, month), v = C.values(e, g.cross);

  return `<div class="entry-group"><h3>${icon('wallet')}Captação Líquida <small>meta ${C.shortMoney(g.cap)}</small></h3>${slider({ key: 'cap', label: 'Captação líquida do mês', value: cap, min: 0, max: Math.max(g.cap * 3, cap), step: capStep, fmt: FMT.money, presets: goalPresets(g.cap, capStep) })}<details class="sub" ${(+e.prev || +e.stvm) ? 'open' : ''}><summary>Previdência e STVM dentro da captação <em>pesam 1,25×</em></summary>${slider({ key: 'prev', label: 'Previdência', value: +e.prev || 0, min: 0, max: Math.max(cap, +e.prev || 0, capStep), step: capStep, fmt: FMT.money, presets: [['Zero', 0], ['25%', roundStep(cap * .25, capStep)], ['50%', roundStep(cap * .5, capStep)]], hint: 'Também entra na cesta de investimento (1,25×).' })}${slider({ key: 'stvm', label: 'STVM', value: +e.stvm || 0, min: 0, max: Math.max(cap, +e.stvm || 0, capStep), step: capStep, fmt: FMT.money, presets: [['Zero', 0], ['25%', roundStep(cap * .25, capStep)]] })}</details><small class="calc" data-calc="cap">Captação MEREO: <b>${C.shortMoney(v.cap)}</b></small></div>
  <div class="entry-group"><h3>${icon('arrow')}Cesta Investimentos <small>meta ${C.shortMoney(g.cesta)}</small></h3>${slider({ key: 'aloc', label: 'Alocação do mês', value: +e.aloc || 0, min: 0, max: Math.max(g.cesta * 3, +e.aloc || 0), step: cestaStep, fmt: FMT.money, presets: goalPresets(g.cesta, cestaStep) })}<small class="calc" data-calc="cesta">Cesta MEREO (alocação + previdência 1,25×): <b>${C.shortMoney(v.cesta)}</b></small></div>
  <div class="entry-group"><h3>${icon('plus')}Cesta Cross Sell <small>meta ${C.fmtNum(g.cross)} pts</small></h3>${slider({ key: 'cards', label: 'Cartões (1 pt cada)', value: +e.cards || 0, min: 0, max: Math.max(Math.ceil(g.cross * 2), +e.cards || 0, 10), step: 1, fmt: FMT.int, presets: [0, 5, 10, 15, 20, 25].map(n => [String(n), n]) })}${slider({ key: 'seg', label: 'Seguros (1 pt a cada R$ 1 mil)', value: +e.seg || 0, min: 0, max: Math.max(30000, +e.seg || 0), step: 500, fmt: FMT.money, presets: [['Zero', 0], ['R$ 2 mil', 2000], ['R$ 5 mil', 5000], ['R$ 10 mil', 10000]] })}${slider({ key: 'con', label: 'Consórcio (1 pt a cada R$ 10 mil)', value: +e.con || 0, min: 0, max: Math.max(300000, +e.con || 0), step: 5000, fmt: FMT.money, presets: [['Zero', 0], ['R$ 50 mil', 50000], ['R$ 100 mil', 100000], ['R$ 200 mil', 200000]] })}<small class="calc" data-calc="cross">Pontos de crossell: <b>${C.fmtNum(v.cross)} pts</b>${(+e.seg || 0) / 1000 < C.CROSS_MIN_SEG ? ' · faltam ' + C.fmtNum(C.CROSS_MIN_SEG - (+e.seg || 0) / 1000) + ' pts de seguros para o mínimo' : ''}</small></div>
  <div class="entry-group two"><div><h3>${icon('target')}Índice Comercial <small>meta ${C.fmtNum(g.ic)}%</small></h3>${slider({ key: 'ic', label: 'IC do mês', value: e.ic ?? g.ic, isNull: e.ic == null, nullable: true, min: 0, max: 120, step: .5, fmt: FMT.pct, presets: [[C.fmtNum(g.ic * .9) + '%', roundStep(g.ic * .9, .5)], [C.fmtNum(g.ic) + '%', g.ic], [C.fmtNum(g.ic * 1.1) + '%', roundStep(g.ic * 1.1, .5)]] })}</div><div><h3>${icon('users')}NPS Assessoria <small>meta ${C.fmtNum(g.nps)}</small></h3>${slider({ key: 'nps', label: 'NPS do mês', value: e.nps ?? g.nps, isNull: e.nps == null, nullable: true, min: -100, max: 100, step: .5, fmt: FMT.nps, presets: [['30', 30], [C.fmtNum(g.nps), g.nps], ['60', 60], ['80', 80]] })}</div></div>`;
}
function memberMonth(m) {

function memberSemester(m) {

}

function editSemGoals(id) {
  const m = member(id); if (!m) return;

  const metas = [['cap', 'Captação', 50000, FMT.money], ['cesta', 'Cesta', 100000, FMT.money], ['cross', 'Crossell', 1, v => C.fmtNum(v) + ' pts']];
  const block = ([k, label, step, fmt]) => {

  };
  showModal(`Metas do ${semLabel(sem)} · ${esc(m.name)}`, `<div class="chip-group" style="margin-bottom:16px"><div class="chips">${metas.map(([k, l], i) => `<button type="button" class="chip ${i === 0 ? 'on' : ''}" data-semtab="${k}">${l}</button>`).join('')}</div></div>${metas.map(block).join('')}<p class="small muted" style="margin-top:14px">Padrão mensal: ${C.shortMoney(base.cap)} captação · ${C.shortMoney(base.cesta)} cesta · ${C.fmtNum(base.cross)} pts. Meses iguais ao padrão não ficam marcados como ajuste.</p>`, (f, form) => {
    const mg = { ...(m.monthGoals || {}) };

      form.addEventListener('click', e => { const t = e.target.closest('[data-semtab]'); if (!t) return; form.querySelectorAll('[data-semtab]').forEach(b => b.classList.toggle('on', b === t)); form.querySelectorAll('.semgoal').forEach(fs => fs.hidden = fs.dataset.metric !== t.dataset.semtab); });
      form.addEventListener('input', e => {
        const t = e.target;
        if (t.dataset.semtotal) { const k = t.dataset.semtotal, step = metas.find(x => x[0] === k)[2], each = roundStep(+t.value / 6, step); form.querySelectorAll(`[data-semmonth="${k}"]`).forEach(s => { s.value = each; form.querySelector(`[data-mout="${k}-${s.dataset.i}"]`).textContent = fmts[k](+s.value); }); form.querySelector(`[data-total="${k}"]`).textContent = fmts[k](+t.value); }
        if (t.dataset.semmonth) { const k = t.dataset.semmonth; form.querySelector(`[data-mout="${k}-${t.dataset.i}"]`).textContent = fmts[k](+t.value); const tot = [...form.querySelectorAll(`[data-semmonth="${k}"]`)].reduce((s, x) => s + +x.value, 0); form.querySelector(`[data-total="${k}"]`).textContent = fmts[k](tot); form.querySelector(`[data-semtotal="${k}"]`).value = tot; }

function currentEntry() { const k = entryKey(memberId, month), e = state.entries[k]; return e && !e.cleared ? e : null; }
function setEntry(patch) {
  const k = entryKey(memberId, month), cur = currentEntry() || { status: 'est' };
  state.entries[k] = { ...cur, ...patch, updatedAt: now() };
}
function liveRefresh() {
  const m = member(memberId), e = currentEntry() || {}, v = C.values(e, C.goalsFor(m, month).cross);
  $('#scorePanel').innerHTML = scorePanel(m);
  const calc = { cap: `Captação MEREO: <b>${C.shortMoney(v.cap)}</b>`, cesta: `Cesta MEREO (alocação + previdência 1,25×): <b>${C.shortMoney(v.cesta)}</b>`, cross: `Pontos de crossell: <b>${C.fmtNum(v.cross)} pts</b>${(+e.seg || 0) / 1000 < C.CROSS_MIN_SEG ? ' · faltam ' + C.fmtNum(C.CROSS_MIN_SEG - (+e.seg || 0) / 1000) + ' pts de seguros para o mínimo' : ''}` };
  for (const [k, h] of Object.entries(calc)) { const el = $(`[data-calc="${k}"]`); if (el) el.innerHTML = h; }
  const cap = +e.cap || 0;
  for (const k of ['prev', 'stvm']) { const s = $(`[data-entry="${k}"]`); if (s) s.max = Math.max(cap, +s.value, +s.step); }
}
const sliderFmt = key => ({ cap: FMT.money, prev: FMT.money, stvm: FMT.money, aloc: FMT.money, seg: FMT.money, con: FMT.money, cards: FMT.int, ic: FMT.pct, nps: FMT.nps })[key];
function onEntrySlide(input) {
  const k = input.dataset.entry, val = +input.value;
  setEntry({ [k]: val });
  const box = input.closest('.sl'); box.classList.remove('is-null');
  box.querySelector('.sl-out').textContent = sliderFmt(k)(val);
  box.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.v - val) < +input.step / 2));
  box.querySelector('[data-null]')?.classList.remove('on');
  liveRefresh();
}
function typeValue(btn) {
  const key = btn.dataset.type, scope = btn.dataset.scope, range = btn.closest('.sl').querySelector('input[type=range]');
  const inp = document.createElement('input'); inp.type = 'number'; inp.inputMode = 'decimal'; inp.step = 'any'; inp.value = range.value; inp.className = 'sl-type';
  btn.replaceWith(inp); inp.focus(); inp.select();
  const done = () => {
    const v = parseFloat(String(inp.value).replace(',', '.'));
    const out = document.createElement('button'); out.type = 'button'; out.className = 'sl-out'; out.dataset.type = key; out.dataset.scope = scope;
    inp.replaceWith(out);
    if (isFinite(v)) {
      if (v > +range.max) range.max = v; if (v < +range.min) range.min = v;
      range.step = 'any'; range.value = v;
      if (scope === 'entry') { setEntry({ [key]: v }); persist(); render(); return; }
      range.dispatchEvent(new Event('input', { bubbles: true }));
    }
    out.textContent = (scope === 'entry' ? sliderFmt(key) : goalFmt(key))(+range.value);
  };
  inp.addEventListener('blur', done, { once: true });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
}
const goalFmt = k => ({ cap: FMT.money, cesta: FMT.money, cross: v => C.fmtNum(v) + ' pts', ic: FMT.pct, nps: FMT.nps })[k] || FMT.nps;

const actions = {

  'cycle-theme': () => { const i = THEMES.findIndex(t => t[0] === theme); applyTheme(THEMES[(i + 1) % THEMES.length][0]); notify('Tema ' + THEMES.find(t => t[0] === theme)[1] + '.'); if (screen === 'settings') render(); },
  'period-prev': () => { if (view === 'month') month = shiftMonth(month, -1); else sem = C.shiftSemester(sem, -1); render(); },
  'period-next': () => { if (view === 'month') month = shiftMonth(month, 1); else sem = C.shiftSemester(sem, 1); render(); },
  'add-member': addMember, 'goals-all': goalsAll,
  'edit-goals': b => editGoals(b.dataset.id), 'remove-member': b => removeMember(b.dataset.id),
  'restore-member': b => { commit(s => { s.members[b.dataset.id] = { ...s.members[b.dataset.id], removedAt: null, updatedAt: now() }; }); notify('Membro restaurado.'); },
  'edit-sem-goals': () => editSemGoals(memberId),
  'member-prev': () => stepMember(-1), 'member-next': () => stepMember(1),
  'copy-prev': () => {
    const prev = state.entries[entryKey(memberId, shiftMonth(month, -1))];
    if (!C.hasData(prev)) { notify('O mês anterior não tem lançamento.'); return; }
    const before = state.entries[entryKey(memberId, month)];
    const { updatedAt, status, ...vals } = prev;
    commit(s => { s.entries[entryKey(memberId, month)] = { ...vals, status: 'est', updatedAt: now() }; });
    notify('Estimativa copiada de ' + monthName(shiftMonth(month, -1), { month: 'long' }) + '.', () => commit(s => { s.entries[entryKey(memberId, month)] = before ? { ...before, updatedAt: now() } : { cleared: true, updatedAt: now() }; }));
  },
  'repeat-sem': () => {
    const cur = currentEntry(); if (!C.hasData(cur)) { notify('Estime este mês primeiro.'); return; }
    const months = C.semesterMonths(C.semesterOf(month)).filter(mo => mo > month);
    if (!months.length) { notify('Este já é o último mês do semestre.'); return; }
    const targets = months.filter(mo => !C.hasData(state.entries[entryKey(memberId, mo)]) || (state.entries[entryKey(memberId, mo)].status || 'est') === 'est');
    const backup = Object.fromEntries(targets.map(mo => [mo, state.entries[entryKey(memberId, mo)]]));
    const { updatedAt, status, ...vals } = cur;
    commit(s => { for (const mo of targets) s.entries[entryKey(memberId, mo)] = { ...vals, status: 'est', updatedAt: now() }; });
    notify(`Estimativa repetida em ${targets.length} ${targets.length === 1 ? 'mês' : 'meses'} (realizados preservados).`, () => commit(s => { for (const mo of targets) s.entries[entryKey(memberId, mo)] = backup[mo] ? { ...backup[mo], updatedAt: now() } : { cleared: true, updatedAt: now() }; }));
  },
  'clear-month': () => {
    const before = currentEntry();
    commit(s => { s.entries[entryKey(memberId, month)] = { cleared: true, updatedAt: now() }; });
    notify('Lançamento de ' + monthName(month, { month: 'long' }) + ' limpo.', () => commit(s => { s.entries[entryKey(memberId, month)] = { ...before, updatedAt: now() }; }));
  },
  'demo': () => { demoBackup = state; state = demoState(); demo = true; screen = 'team'; render(); },
  'exit-demo': () => { state = demoBackup || C.emptyState(); demo = false; demoBackup = null; screen = 'team'; render(); },
  'save-team': () => { const team = $('#teamName').value.trim() || 'Meu time', leader = $('#leaderName').value.trim(); commit(s => { s.settings = { ...s.settings, team, leader, updatedAt: now() }; }); notify('Time atualizado.'); },
  'create-key': async b => { if (demo) { notify('Saia do exemplo para criar sua chave.'); return; } b.disabled = true; try { await connectCloud(genKey(), true); render(); if (syncStatus === 'synced') showKey(); } catch (e) { cloud = null; store.del(LS.key); notify(e.message); render(); } },
  'share-team': b => shareTeam(b),
  'show-key': showKey, 'sync-now': () => sync({ quiet: false }).then(() => syncStatus === 'synced' && notify('Base sincronizada.')),
  'disconnect': () => { store.del(LS.key); cloud = null; setStatus('local'); render(); notify('Desconectado. Os dados continuam neste aparelho.'); },
  'export': () => { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mereo-time-${new Date().toISOString().slice(0, 10)}.json`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  'import': () => $('#importFile').click()
};
function shiftMonth(m, d) { const dt = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + d, 1); return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; }
function stepMember(d) { const list = members(), i = list.findIndex(x => x.id === memberId); if (list.length < 2) return; memberId = list[(i + d + list.length) % list.length].id; render(); }
function openMember(id) { memberId = id; screen = 'member'; render(); }

document.addEventListener('click', e => {
  const t = e.target;
  if (dialog.open && dialog.contains(t)) {
    const p = t.closest('[data-preset]'); if (p) { const r = p.closest('.sl').querySelector('input[type=range]'); if (+p.dataset.v > +r.max) r.max = p.dataset.v; r.value = p.dataset.v; r.dispatchEvent(new Event('input', { bubbles: true })); }
    const o = t.closest('.sl-out'); if (o) typeValue(o);
    return;
  }
  const nav = t.closest('[data-nav]'); if (nav) { screen = nav.dataset.nav; render(); return; }
  const mem = t.closest('[data-member]'); if (mem) { openMember(mem.dataset.member); return; }
  const vw = t.closest('[data-view]'); if (vw) { view = vw.dataset.view; if (view === 'semester') sem = C.semesterOf(month); else if (!C.semesterMonths(sem).includes(month)) month = C.semesterMonths(sem).includes(todayMonth) ? todayMonth : C.semesterMonths(sem)[0]; render(); return; }
  const sm = t.closest('[data-semmode]'); if (sm) { semMode = sm.dataset.semmode; render(); return; }
  const om = t.closest('[data-open-month]'); if (om) { month = om.dataset.openMonth; view = 'month'; render(); return; }
  const st = t.closest('[data-status]'); if (st) { setEntry({ status: st.dataset.status }); persist(); render(); return; }
  const th = t.closest('[data-theme-pick]'); if (th) { applyTheme(th.dataset.themePick); render(); return; }
  const pr = t.closest('[data-preset]'); if (pr && pr.dataset.scope === 'entry') { setEntry({ [pr.dataset.preset]: +pr.dataset.v }); persist(); render(); return; }
  const nl = t.closest('[data-null]'); if (nl && nl.dataset.scope === 'entry') { setEntry({ [nl.dataset.null]: null }); persist(); render(); return; }
  const out = t.closest('.sl-out'); if (out) { typeValue(out); return; }
  const a = t.closest('[data-action]'); if (a && actions[a.dataset.action]) { actions[a.dataset.action](a); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.entry) { isSliding = true; onEntrySlide(t); return; }
  if (dialog.open && t.dataset.goal) { const box = t.closest('.sl'); box.querySelector('.sl-out').textContent = goalFmt(t.dataset.goal)(+t.value); box.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.v - +t.value) < (+t.step || 1e-6) / 2)); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.entry) { isSliding = false; persist(); return; }
  if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then(txt => { const inc = C.validate(JSON.parse(txt)); commit(s => { const m = C.merge(s, inc); Object.assign(s, m); }); notify(`Importado: ${Object.keys(inc.members).length} membros, ${Object.keys(inc.entries).length} lançamentos.`); }).catch(err => notify('Não foi possível importar: ' + err.message));
    t.value = '';
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'keyForm') return; e.preventDefault();
  if (demo) { notify('Saia do exemplo para conectar.'); return; }
  const k = new FormData(e.target).get('key'); const btn = e.target.querySelector('button'); btn.disabled = true;
  try { await connectCloud(k, false); render(); notify('Conectado. Base sincronizada.'); } catch (err) { cloud = null; store.del(LS.key); btn.disabled = false; notify(err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && dialog.open) dialog.close(); });

render();
})();

</script></body></html>
